<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kidoboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffcc2e'/%3E%3Crect x='12' y='20' width='40' height='32' rx='9' fill='%23b4add9'/%3E%3Crect x='12' y='12' width='40' height='32' rx='9' fill='%23fff'/%3E%3C/svg%3E">
<style>
  /* Everything you can press is a chunky key: a flat face on a thick edge that sinks when pressed. */
  :root {
    --ink: #221b4a; --sun: #ffcc2e; --tomato: #d9381e; --sky: #2a6ee0; --leaf: #0f8552; --grape: #7b4bd1; --rose: #d93a78; --teal: #0b827d;
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, sans-serif;
  }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--sun); color: var(--ink); }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  .cap { --c: #fff; --d: 8px; position: relative; border: 0; background: var(--c); border-radius: 18px;
         box-shadow: 0 var(--d) 0 color-mix(in oklab, var(--c) 68%, var(--ink)); transition: transform .08s, box-shadow .08s; }
  .cap.down, button.cap:active { transform: translateY(var(--d)); box-shadow: 0 0 0 color-mix(in oklab, var(--c) 68%, var(--ink)); }

  /* ---- home: laid out like a keyboard, one row of keys per track ---- */
  #home { max-width: 1120px; margin: 0 auto; padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 48px) 64px; }
  .logo { display: flex; gap: clamp(4px, .9vw, 10px); margin: 0 0 20px; }
  .logo .cap { --d: clamp(4px, .8vw, 8px); width: clamp(30px, 7.6vw, 82px); aspect-ratio: 1; border-radius: 24%; display: grid; place-items: center;
               font-size: clamp(18px, 4.4vw, 48px); font-weight: 900; user-select: none; }
  .tag { margin: 0 0 18px; max-width: 36ch; font-size: clamp(18px, 2.2vw, 26px); font-weight: 700; line-height: 1.25; }
  .track { margin-top: clamp(28px, 4vw, 44px); }
  .track h2 { margin: 0; font-size: clamp(22px, 2.6vw, 32px); font-weight: 900; }
  .track h3 { margin: 22px 0 0; font-size: 20px; font-weight: 900; }
  .track p, .track li { max-width: 66ch; font-size: 17px; font-weight: 600; line-height: 1.4; }
  .track > p { margin: 4px 0 14px; }
  .track ul, .track ol { margin: 6px 0 18px; padding-left: 1.3em; }
  .track li { margin: 5px 0; }
  .track small { font-size: 14px; font-weight: 700; opacity: .8; }
  .seg { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 16px; font-weight: 800; }
  .seg .cap, .tools .cap { --d: 5px; padding: 9px 16px; border-radius: 13px; font-size: 15px; font-weight: 800; }
  .seg .cap[aria-pressed=true] { --c: var(--ink); color: #fff; transform: translateY(3px); box-shadow: 0 2px 0 #000; }
  .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; padding-bottom: 12px; }
  .go { --d: 12px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto 1fr auto; gap: 4px 12px; padding: 18px 20px 16px; border-radius: 28px; color: #fff; text-align: left; }
  .go.later { opacity: .6; filter: saturate(.6); }  /* for an older child; still playable */
  .go .num { font-size: 22px; font-weight: 900; }
  .go .num em { margin-left: 8px; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, .24); font-size: 13px; font-style: normal; font-weight: 800; vertical-align: 3px; white-space: nowrap; }
  .go svg { grid-row: 1 / 3; grid-column: 2; width: clamp(52px, 6vw, 76px); }
  .go strong { align-self: end; font-size: clamp(26px, 2.8vw, 36px); font-weight: 900; line-height: 1; }
  .go .sub { grid-column: 1 / 3; margin-top: 2px; font-size: 16px; font-weight: 700; line-height: 1.3; }
  .go .prog { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; font-weight: 800; white-space: nowrap; }
  .prog b { flex: 0 0 64px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #fff var(--p), rgba(255,255,255,.3) 0); }
  .prog i { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #fff; }
  .prog i.on { background: #fff; }
  .ico { fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .ico .f { fill: currentColor; }
  .ico text { fill: currentColor; stroke: none; font-weight: 900; font-size: 30px; text-anchor: middle; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 16px; padding-bottom: 8px; }
  .tools a { color: inherit; font-weight: 800; }
  @media (max-width: 900px) { .row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } .go { padding: 14px 14px 12px; border-radius: 22px; } .go .sub { font-size: 15px; } }

  /* your voice: one tile per word, hold to record */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; margin: 18px 0 26px; padding-bottom: 8px; }
  .tile { --d: 6px; padding: 8px 8px 10px; border-radius: 16px; font-size: 15px; font-weight: 800; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .tile img, .tile span { display: block; width: 100%; aspect-ratio: 4 / 3; margin-bottom: 6px; border-radius: 10px; object-fit: cover; pointer-events: none; }
  .tile.has::after { content: ''; position: absolute; right: 10px; top: 10px; width: 16px; height: 16px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 0 3px #fff; }
  .tile.rec { --c: var(--tomato); color: #fff; }
  #micNote { font-weight: 800; }

  /* key stickers: only this prints */
  #stickers { display: none; }
  @media print {
    body { background: #fff; }
    #home, #play { display: none !important; }
    #stickers { display: block; color: #000; font-family: sans-serif; }
    #stickers h1 { font-size: 14pt; margin: 0 0 2mm; }
    #stickers p { font-size: 9pt; margin: 0 0 8mm; }
    #stickers div { display: flex; margin-bottom: 4mm; }
    #stickers figure { width: 12mm; margin: 0 2.5mm; }
    #stickers img, #stickers span { display: block; width: 12mm; height: 12mm; border-radius: 2mm; object-fit: cover; box-shadow: 0 0 0 .2mm #999; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    #stickers figcaption { font-size: 7pt; text-align: center; margin-top: 1mm; }
  }

  /* ---- play: one full-screen page per activity, sized in vmin so it fills any screen ---- */
  #play { --bg: var(--ink); --fg: #fff; position: fixed; inset: 0; overflow: hidden; background: var(--bg); color: var(--fg); transition: background .5s;
          user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #play img { pointer-events: none; }  /* a press that slides must not start dragging the photo */
  #play.kb:not(.peek), #play.kb:not(.peek) *, #play.ms, #play.ms *, #play.learn, #play.learn * { cursor: none; }
  #play.touch .cursor, #play.touch .mousey, #play.learn:not(.moused) .cursor { display: none; }  /* a finger needs no arrow; nor does a keyboard */
  #scene { position: absolute; inset: 0; box-sizing: border-box; display: grid; place-content: center; justify-items: center; gap: 4vmin; text-align: center; }
  #leave { --c: #fff; --d: .8vmin; position: absolute; left: 2vmin; top: 2vmin; z-index: 6; width: max(7vmin, 40px); height: max(7vmin, 40px); padding: 0; border-radius: 28%;
           color: var(--ink); opacity: .5; overflow: hidden; display: grid; place-items: center; }
  #leave svg { position: relative; z-index: 1; width: 62%; }
  #leave::after { content: ''; position: absolute; inset: 0; background: var(--sun); transform-origin: bottom; scale: 1 0; }
  #leave.holding { opacity: 1; }
  #leave.holding::after { scale: 1 1; transition: scale 1s linear; }

  .pop { animation: pop .7s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(0) rotate(-20deg); } }
  .wiggle { animation: wiggle .3s; }
  @keyframes wiggle { 25% { transform: translateX(-3vmin); } 75% { transform: translateX(3vmin); } }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  .caption { position: absolute; top: 3.5vmin; left: 12vmin; right: 12vmin; z-index: 4; font-size: 8vmin; font-weight: 900; line-height: 1; pointer-events: none; }
  .how { position: absolute; left: 0; right: 0; bottom: 4vmin; margin: 0; padding: 0 22vmin; font-size: max(2.6vmin, 15px); font-weight: 700; opacity: .85; pointer-events: none; }
  .ripple { position: absolute; left: 0; top: 0; z-index: 5; width: 10vmin; height: 10vmin; margin: -5vmin; border-radius: 50%; border: .8vmin solid var(--fg);
            box-sizing: border-box; pointer-events: none; animation: ripple .45s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.2); } to { transform: scale(1); opacity: 0; } }
  .word { font-size: 10vmin; font-weight: 900; line-height: 1; }
  .word.small { font-size: 6vmin; }
  .moon { width: 30vmin; height: 30vmin; border-radius: 50%; box-shadow: inset -8vmin -3vmin 0 0 var(--sun); rotate: -18deg; }

  /* press and find: the picture on top, the keyboard mirror below */
  .explore #scene, .find #scene { display: flex; flex-direction: column; align-items: center; gap: 2vmin; padding: 3vmin; }
  .stage { flex: 1; min-height: 0; display: grid; place-content: center; justify-items: center; gap: 2.2vmin; }
  .card { box-sizing: border-box; height: 36vmin; width: min(54vmin, 88vw); border: 1vmin solid #fff; border-radius: 4.5vmin; overflow: hidden; background: #fff;
          box-shadow: 0 1.6vmin 0 rgba(0, 0, 0, .22); }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card .blob { display: none; height: 100%; }
  .card.colour { width: 36vmin; border: 1.6vmin solid var(--fg); border-radius: 50%; }
  .card.colour img, .card.idle img { display: none; }
  .card.colour .blob { display: block; box-shadow: inset 0 -3vmin 0 rgba(0, 0, 0, .16); }
  .card.idle { display: grid; place-items: center; border: 0; background: none; box-shadow: none; overflow: visible; }
  .card.idle .blob { display: block; width: 22vmin; height: 22vmin; border-radius: 5vmin; background: #fff; box-shadow: 0 2.6vmin 0 #b4add9; animation: tap 1.5s infinite; }
  @keyframes tap { 30% { transform: translateY(2.6vmin); box-shadow: 0 0 0 #b4add9; } 55% { transform: none; } }
  .card.asking { animation: nod 1.6s ease-in-out infinite; }
  @keyframes nod { 50% { transform: scale(1.04); } }
  /* a line for the grown-up: something to say or ask about what is on screen */
  .ask { min-height: 1.3em; margin: 0; max-width: 90vw; font-size: max(3vmin, 16px); font-weight: 700; line-height: 1.3; opacity: .92; }
  .ask svg { width: 1.1em; margin-right: .4em; vertical-align: -.2em; }

  .mirror { --k: min(7.2vmin, 8.4vw); --gap: calc(var(--k) * .16); display: grid; gap: var(--gap); padding-bottom: calc(var(--k) * .14); }
  .mirror div { display: flex; gap: var(--gap); }
  .mirror div:nth-child(2) { margin-left: calc(var(--k) * .5); }  /* staggered like the real thing, so places match */
  .mirror div:nth-child(3) { margin-left: calc(var(--k) * .8); }
  .mirror div:nth-child(4) { margin-left: calc(var(--k) * 1.35); }
  .key { --d: calc(var(--k) * .12); width: calc(var(--k) * var(--n, 1) + var(--gap) * (var(--n, 1) - 1)); height: var(--k); padding: 0; border-radius: calc(var(--k) * .24); overflow: hidden;
         transition: transform .08s, box-shadow .08s, opacity .4s; }
  .key img { display: block; height: 100%; aspect-ratio: 1; margin: 0 auto; object-fit: cover; border-radius: calc(var(--k) * .24); }
  .key i { position: absolute; left: 0; top: 0; min-width: 44%; padding: 0 6%; box-sizing: border-box; border-radius: 0 0 36% 0; background: #fff; color: var(--ink);
           font-size: calc(var(--k) * .28); font-weight: 900; font-style: normal; line-height: 1.35; text-align: center; }
  .mirror.big { grid-template-columns: repeat(3, calc(var(--k) * 3.4)); grid-auto-rows: calc(var(--k) * 2 + var(--gap)); }  /* six big keys: six pictures */
  .mirror.big .key { --d: calc(var(--k) * .2); width: auto; height: auto; border-radius: calc(var(--k) * .4); }
  .mirror.big .key img { width: 100%; aspect-ratio: auto; border-radius: 0; }
  .key.out { opacity: .22; }
  .key.on { transform: translateY(var(--d)); box-shadow: 0 0 0 calc(var(--k) * .1) #fff; z-index: 1; }
  .key.target { z-index: 2; box-shadow: 0 0 0 calc(var(--k) * .1) #fff, 0 0 calc(var(--k) * .7) calc(var(--k) * .2) #fff; animation: pulse .8s ease-in-out infinite; }

  /* a big pointer, and (in the mouse steps) a little mouse on its mat that mirrors the hand */
  .cursor { position: absolute; left: 0; top: 0; z-index: 9; width: 8vmin; pointer-events: none; transform-origin: 10% 6%; transition: scale .08s;
            filter: drop-shadow(0 .7vmin 0 rgba(0, 0, 0, .25)); }
  .cursor.down { scale: .8; }
  .cursor svg, .mousey svg { display: block; overflow: visible; }
  .cursor path, .mousey path, .mousey rect { fill: #fff; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
  .mousey { position: absolute; right: 3vmin; bottom: 3vmin; z-index: 5; width: 17vmin; height: 17vmin; border-radius: 4vmin; display: grid; place-items: center;
            background: color-mix(in oklab, var(--fg) 18%, transparent); pointer-events: none; }
  .mousey svg { height: 10.5vmin; }
  .mousey.left .l, .mousey.right .r { fill: var(--sun); }
  @media (max-aspect-ratio: 1/1) { .mousey { display: none; } }

  .sleeper { --s: 20vmin; position: absolute; z-index: 1; width: var(--s); height: var(--s); margin: calc(var(--s) / -2); border-radius: 50%; overflow: hidden; }
  .sleeper img, .flap img, .choice > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .sleeper.awake { z-index: 3; box-shadow: 0 0 0 1vmin #fff, 0 0 6vmin 2vmin rgba(255, 204, 46, .75); animation: pop .7s cubic-bezier(.3, 1.6, .5, 1); }
  .dark { position: absolute; inset: 0; z-index: 2; pointer-events: none; transition: opacity 1.6s;
          background: radial-gradient(circle var(--r) at var(--x, 50%) var(--y, 50%), rgba(255, 204, 46, .1) 40%, rgba(255, 204, 46, .32) 58%, rgba(34, 27, 74, .97) 100%); }
  .dark.dawn { opacity: 0; }

  .flaps, .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 4vmin; }
  .flap { --d: 1.6vmin; width: var(--s); height: var(--s); padding: 0; border-radius: 22%; overflow: hidden; }
  .flap::before, .flap::after { content: ''; position: absolute; top: 36%; left: 27%; width: 17%; aspect-ratio: 1; border-radius: 50%;
                                background: radial-gradient(circle at 50% 62%, var(--ink) 34%, #fff 37%); transition: opacity .2s; }
  .flap::after { left: 56%; }
  .flap img { opacity: 0; scale: .5; transition: opacity .25s, scale .35s cubic-bezier(.3, 1.6, .5, 1); }
  .flap.open { --c: #fff !important; }
  .flap.open img { opacity: 1; scale: 1; }
  .flap.open::before, .flap.open::after { opacity: 0; }

  .shelf { position: absolute; left: 0; right: 0; bottom: 7vmin; display: flex; justify-content: center; gap: 4vmin; }
  .basket { --d: 1.8vmin; width: 28vmin; height: 19vmin; border-radius: 3vmin 3vmin 7vmin 7vmin; transition: scale .15s; }
  .basket::before { content: ''; position: absolute; inset: 1.8vmin 2vmin auto; height: 5.5vmin; border-radius: 50%; background: color-mix(in oklab, var(--c) 55%, var(--ink)); }
  .basket.open { scale: 1.12; }
  .ball, .disc { border-radius: 50%; background: var(--c); box-shadow: inset 0 -1.4vmin 0 rgba(0, 0, 0, .18), 0 0 0 .6vmin #fff, 0 1.4vmin 0 .6vmin rgba(34, 27, 74, .18); }
  .ball { --b: 18vmin; position: absolute; left: 0; top: 0; z-index: 4; width: var(--b); height: var(--b); margin: calc(var(--b) / -2); }
  .ball.glide { transition: translate .45s cubic-bezier(.3, 1.3, .5, 1), scale .45s, opacity .45s; }
  .ball.held { scale: 1.12; }
  .ball.in { scale: .45; opacity: 0; }

  /* learn: one question, two or three pictures */
  .ear { --d: 1.4vmin; width: 15vmin; height: 15vmin; padding: 0; border-radius: 50%; color: var(--teal); display: grid; place-items: center; }
  .ear svg { width: 58%; }
  .top { display: flex; align-items: center; gap: 0; min-height: 13vmin; font-size: 13vmin; font-weight: 900; line-height: 1; }
  .top svg { width: 15vmin; height: 15vmin; }
  .top .cap { width: 11vmin; height: 11vmin; border-radius: 24%; color: var(--ink); font-size: 8vmin; display: grid; place-items: center; --d: 1vmin; }
  .choices { --s: min(34vmin, 27vw); max-width: 96vw; }
  .choices.two { --s: min(44vmin, 40vw); gap: min(14vmin, 8vw); }  /* far apart, so "left" and "right" are plain */
  .top ~ .choices, .ear ~ .choices { --s: min(31vmin, 27vw); }
  .top ~ .choices.two, .ear ~ .choices.two { --s: min(38vmin, 40vw); }
  .choice { --d: 1.6vmin; width: var(--s); height: var(--s); padding: 1vmin; border-radius: 4.5vmin; color: var(--ink); overflow: hidden;
            transition: transform .08s, box-shadow .08s, opacity .4s, scale .3s, filter .4s; }
  .choice > img { border-radius: 3.5vmin; }
  .choice .disc { width: 78%; height: 78%; margin: 11%; box-sizing: border-box; }
  .choice svg { display: block; width: 100%; height: 100%; }
  .set, .sized { position: relative; width: 100%; height: 100%; }
  .set img { position: absolute; width: 29%; height: 29%; border-radius: 50%; object-fit: cover; transition: scale .2s, box-shadow .2s; }
  .set img.on, .pond img.on { scale: 1.18; box-shadow: 0 0 0 .7vmin var(--sun); }
  .sized { display: grid; place-items: center; }
  .sized img { width: calc(var(--z) * 100%); height: calc(var(--z) * 100%); border-radius: 50%; object-fit: cover; }
  .numeral { font-size: calc(var(--s) * .66); font-weight: 900; line-height: calc(var(--s) - 2vmin); }
  .choice.glow { box-shadow: 0 var(--d) 0 color-mix(in oklab, var(--c) 68%, var(--ink)), 0 0 0 1vmin var(--sun), 0 0 5vmin 2vmin #fff; animation: pulse 1s ease-in-out infinite; }
  .choice.no { opacity: .35; filter: grayscale(1); animation: none; }
  .choice.yes { scale: 1.08; z-index: 1; animation: none; }
  .choices.done .choice:not(.yes) { opacity: .2; }

  /* count: every press adds one; race: every press is one hop along the numbers */
  .pond { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 3vmin; max-width: 94vw; min-height: 24vmin; }
  .pond img { width: 21vmin; height: 21vmin; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1vmin #fff; transition: scale .2s, box-shadow .2s; }
  .okay { --c: var(--sun); --d: 1.6vmin; width: 18vmin; height: 18vmin; padding: 0; border-radius: 50%; color: var(--ink); display: grid; place-items: center; }
  .okay svg { width: 56%; }
  .lane { display: flex; gap: 1.2vmin; margin-top: 16vmin; }
  .lane .cap { --d: 1vmin; width: min(8.6vw, 13vmin); height: min(8.6vw, 13vmin); border-radius: 22%; color: var(--ink); font-size: min(5vw, 7.5vmin); font-weight: 900; display: grid; place-items: center; }
  .lane .cap.here { --c: var(--sun); }
  .runner { position: absolute; left: 0; top: 0; z-index: 3; width: min(8.6vw, 13vmin); height: min(8.6vw, 13vmin); border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 .8vmin #fff;
            transition: translate .35s cubic-bezier(.3, 1.4, .5, 1); }
  .dice { --d: 1.4vmin; min-width: 20vmin; height: 20vmin; padding: 0 3vmin; border-radius: 4vmin; color: var(--ink); font-size: 14vmin; font-weight: 900; line-height: 20vmin; }

  /* portrait: a phone held upright has height to spare, so pictures and keys grow */
  @media (max-aspect-ratio: 1/1) {
    .card { width: 82vw; height: 58vw; }
    .card.colour { width: 58vw; }
    .word { font-size: 13vmin; }
    .ask { font-size: max(4.2vmin, 16px); }
    .how { padding: 0 6vmin; font-size: max(3.6vmin, 15px); }
    .mirror.big { --k: 8.6vw; grid-auto-rows: calc(var(--k) * 2.8); }
    .choices { --s: min(46vw, 30vh); }
    .choices.two, .top ~ .choices.two, .ear ~ .choices.two { flex-direction: column; align-items: center; --s: min(72vw, 33vh); gap: 3.5vh; }  /* one above the other, as big as they fit */
    .top ~ .choices.two, .ear ~ .choices.two { --s: min(66vw, 29vh); }
    .flaps { --s: min(var(--size), 42vw) !important; max-width: 96vw !important; }
    .pond img { width: 26vmin; height: 26vmin; }
    .top svg { width: 9vw; height: 9vw; }
    .top .cap { width: 9vw; height: 9vw; font-size: 6vw; }
    .top { gap: 1.4vw; }
  }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="home"></main>
<div id="play" hidden>

const ROWS = [

// The spoken sound is only used for animals without a real clip in snd/.

// ---- the learner: what this kid has met, knows and can do, kept in this browser ----

// seen: times met. know: how well each thing is known (0 to 3), per subject. lvl, streak: mouse steps.
const fresh = () => ({ seen: {}, know: { words: {}, english: {}, numbers: {}, shapes: {}, keys: {} }, lvl: {}, streak: {}, age: 2, grain: 'big', minutes: 10 });

function keyInfo(code) {
  const r = ROWS.findIndex(row => row.includes(code));
  if (r < 0) return null;
  const c = ROWS[r].indexOf(code);
  if (r === 0) {

    return { code, emoji, bg, fg, en, names: [en, fr], name: FR ? fr : en, sound: '', img: '', clip: '' };
  }

  const c = ROWS[r].indexOf(code);

}

  const at = where(code);

}

// A question has two or three pictures side by side: any key on the left of the keyboard means the left one, and so on.
function sideOf(code, n = 2) {
  if (code.startsWith('Arrow')) return { ArrowLeft: 0, ArrowRight: n - 1, ArrowDown: n === 3 ? 1 : null, ArrowUp: n === 3 ? 1 : null }[code] ?? null;
  const at = where(code);
  return at ? (n === 3 ? at.part : +(at.c >= 5)) : null;

const STAGE_MS = 1500;

// something is known the more often it comes back. Each subject is an ordered list, easiest and most familiar first.
const INTRO = (() => { // words: familiar animals first, colours later (colour words are hard at two)
  const first = ['cow', 'cat', 'dog', 'duck', 'pig', 'sheep', 'horse', 'chicken', 'rabbit', 'lion', 'elephant', 'bear', 'red', 'blue', 'yellow'].map(en => byName(en).code);

const SUBJECTS = {
  words:   { start: 3, order: INTRO, floor: [0, 8, 20, 36] },
  english: { start: 3, order: INTRO, floor: [0, 0, 0, 0] },
  // q3: "three" as a quantity. more: which set has more. d3: the written 3. Number words are learned one at a time, in order.
  numbers: { start: 2, order: ['q1', 'q2', 'q3', 'more', 'q4', 'q5', 'd1', 'd2', 'd3', 'd4', 'd5'], floor: [0, 1, 4, 6] },
  shapes:  { start: 2, order: ['circle', 'square', 'triangle', 'big', 'small', 'rectangle', 'pattern'], floor: [0, 1, 3, 5] },
  keys:    { start: 3, order: INTRO, floor: [0, 0, 0, 0] },

const floorOf = (subject, age = me.age) => SUBJECTS[subject].floor[Math.min(5, Math.max(2, age)) - 2];
const view = (subject, order = SUBJECTS[subject].order, age = me.age, learned = me.know[subject]) =>
  Object.fromEntries(order.map((item, i) => [item, Math.max(learned[item] || 0, i < floorOf(subject, age) ? KNOWN : 0)]));

const hintDelay = know => [0, 4000, 9000, 15000][know];

const grade = (know, { wrong, hinted }) => wrong ? Math.max(0, know - 1) : !hinted || know === 0 ? Math.min(3, know + 1) : know;

  move:  { per: 2, easy: { misses: 99, secs: 30 }, hard: { misses: 99, secs: 120 }, spec: [{ n: 3, size: 24, light: 26, dwell: 0 }, { n: 4, size: 20, light: 20, dwell: 0 }, { n: 5, size: 17, light: 15, dwell: 350 }] },
  click: { per: 2, easy: { misses: 2, secs: Infinity }, hard: { misses: 8, secs: Infinity }, spec: [{ n: 2, size: 36 }, { n: 4, size: 28 }, { n: 6, size: 24 }] },
  drag:  { per: 2, easy: { misses: 2, secs: Infinity }, hard: { misses: 8, secs: Infinity }, spec: [{ n: 1 }, { n: 2 }, { n: 3 }] },

let sessionStart = null, ended = false;
const timeUp = (now = Date.now()) => me.minutes > 0 && sessionStart !== null && now - sessionStart >= me.minutes * 60000;

$('#home').addEventListener('click', e => {
  const go = e.target.closest('.go'), set = e.target.closest('[data-set]');
  if (go) return openAct(go.dataset.act);
  if (set) {
    me[set.dataset.set] = isNaN(set.dataset.value) ? set.dataset.value : +set.dataset.value;
    if (set.dataset.set === 'age') me.grain = { 2: 'big', 3: 'mid' }[me.age] || 'all'; // the keys shrink with age; still adjustable below

  }

  if (e.target.id === 'reset' && confirm(t('resetAsk'))) { me = { ...fresh(), lang: me.lang, age: me.age, grain: me.grain, minutes: me.minutes }; save(); renderHome(); }
  if (e.target.id === 'stick') printStickers();

  if (e.target.id === 'back') { showing = 'home'; micStop(); renderHome(); scrollTo(0, 0); }

$('#home').addEventListener('pointerdown', e => { // the name is made of keys, and keys are for pressing

  cap.classList.add('down');

// How to help, and why: the method behind each game, for the grown-up who wants to do the same away from the screen.
function renderGuide() {

    `<h3>${a.name[+FR]} <small>${a.age[+FR]}</small></h3><p><b>${t('helpLabel')}.</b> ${a.help[+FR]}</p><p><b>${t('whyLabel')}.</b> ${a.why[+FR]}</p>`).join('')}`;

// Your voice: hold a tile, say the word, let go.
let mic = null, recorder = null, recTimer;
function renderVoices() {
  $('#home').innerHTML = `<section class="track"><div class="tools"><button class="cap" id="back">${t('back')}</button></div><h2>${t('voice')}</h2><p>${t('voiceHow')}</p>
    <p id="micNote" hidden>${t('micOff')}</p><div class="tiles">${INTRO.map(code => { const info = keyInfo(code);
      return `<button class="cap tile${voices.has(voiceKey(code)) ? ' has' : ''}" data-code="${code}">${info.img ? `<img src="${info.img}" alt="">` : `<span style="background:${info.bg}"></span>`}${info.name}</button>`; }).join('')}</div>
    <div class="tools"><button class="cap" id="unvoice">${t('voiceErase')}</button></div></section>`;
  const blocked = () => { if ($('#micNote')) $('#micNote').hidden = false; };
  if (mic) return;

    recorder = null;
    tile.classList.remove('rec');

for (const type of ['pointerup', 'pointercancel']) addEventListener(type, recStop);

// ---- play: opening, leaving and the bits every activity shares ----

const play = $('#play'), scene = $('#scene'), leave = $('#leave');

const on = (node, type, fn) => { node.addEventListener(type, fn); cleanup.push(() => node.removeEventListener(type, fn)); };
const paint = (bg, fg = '#fff') => { css(play, '--bg', bg); css(play, '--fg', fg); };

// Each page of an activity is mounted from scratch: timers and listeners of the previous page are dropped first.
// Between two pages is also where a sitting ends, if its time is up.
function mount(kind, first = false) {
  if (!first && timeUp()) return goodbye();
  clear();
  act = kind;
  page = { misses: 0, t0: performance.now() };
  play.className = `${ACTS[kind].track} ${kind}`;
  paint(NIGHT);
  ACTS[kind].start(first);
  if (first && ACTS[kind].tip && !$('.how', scene)) scene.append(el('p', { className: 'how', textContent: ACTS[kind].tip[+FR] }));
}
function openAct(kind) {
  $('#home').hidden = true;
  play.hidden = false;
  sessionStart ??= Date.now();
  // Fullscreen + (Chrome/Edge) keyboard lock keep small hands inside the page.
  Promise.resolve(document.documentElement.requestFullscreen?.()).then(() => navigator.keyboard?.lock?.()).catch(() => {});
  mount(kind, true);
}
function goodbye() {
  clear();
  onKey = () => {}; // still inside an activity, so keys stay swallowed, but nothing answers any more
  ended = true;
  play.className = 'kb bye';
  paint(NIGHT);
  scene.append(el('div', { className: 'moon' }), el('div', { className: 'word', textContent: t('byeWord') }), el('p', { className: 'how', textContent: t('byeHow') }));
  say([t('bye')]);
}
function goHome() {
  clear();
  act = null;
  if (ended) sessionStart = null; // the next sitting starts afresh
  ended = false;
  quiet();
  holdEnd();
  play.hidden = true;
  navigator.keyboard?.unlock?.();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  renderHome();
  $('#home').hidden = false;
}

// Leaving takes a one-second hold, on Esc or on the house: a parent can do it, a stray tap cannot.
const HOLD_MS = 1000;
let holding;
function holdStart() { holdEnd(); leave.classList.add('holding'); holding = setTimeout(goHome, HOLD_MS); }
function holdEnd() { clearTimeout(holding); leave.classList.remove('holding'); }
leave.addEventListener('pointerdown', holdStart);
for (const type of ['pointerup', 'pointerleave', 'pointercancel']) leave.addEventListener(type, holdEnd);

function caption(text) {
  const node = $('.caption') || scene.appendChild(el('div', { className: 'caption' }));
  node.textContent = text;
  again(node, 'pop');
}
function wiggle(node) { again(node, 'wiggle'); }

// The pointer is drawn big. In the mouse steps a little mouse on a mat also copies the hand: it slides when the hand
// slides, its button lights when the finger clicks.
const ptr = { x: innerWidth / 2, y: innerHeight / 2 };
let touching = FINGERS, moused = false;
function mouseKit(withToy = true) {
  const cur = el('div', { className: 'cursor', innerHTML: `<svg viewBox="10 4 38 48"><path d="${POINTER}"/></svg>` });
  const toy = el('div', { className: 'mousey', hidden: !withToy, innerHTML: '<svg viewBox="0 0 64 88"><path class="l" d="M32 4C17 4 6 14 6 30v6h26z"/><path class="r" d="M32 4c15 0 26 10 26 26v6H32z"/>' +
    '<path d="M6 36h52v22c0 15-11 26-26 26S6 73 6 58z"/><rect x="28" y="12" width="8" height="16" rx="4"/></svg>' });
  const place = e => {
    if (e) { ptr.x = e.clientX; ptr.y = e.clientY; touching = e.pointerType === 'touch'; moused ||= e.pointerType === 'mouse'; }
    play.classList.toggle('touch', touching);
    play.classList.toggle('moused', moused);
    cur.style.translate = `${ptr.x}px ${ptr.y}px`;
    toy.firstChild.style.translate = `${(ptr.x / innerWidth - .5) * 36}% ${(ptr.y / innerHeight - .5) * 36}%`;
  };
  scene.append(toy, cur);
  place();
  on(play, 'pointermove', place);
  on(play, 'pointerdown', e => { place(e); cur.classList.add('down'); toy.classList.add(e.button === 2 ? 'right' : 'left'); });
  on(window, 'pointerup', () => { cur.classList.remove('down'); toy.classList.remove('left', 'right'); });
  on(play, 'contextmenu', e => e.preventDefault()); // any button is a click
}
// a click on nothing still answers, so the kid knows the click happened; it also tells us aiming is still hard
function miss() {
  page.misses++;
  tick();
  const node = el('div', { className: 'ripple' });
  node.style.translate = `${ptr.x}px ${ptr.y}px`;
  scene.append(node);
  setTimeout(() => node.remove(), 450);
}

// ---- learn: one question engine for words, a second language, numbers and shapes ----

// A page is one question. A brand-new thing is shown with its answer glowing: that is the lesson. Next time the glow
// waits, then waits longer, until it is not needed. A wrong answer names what was picked, puts it aside and asks again.
// Each subject only has to say how to draw a question: MAKERS[subject](item, how well it is known, how many pictures, what else is in play).
const lastAsked = {};
function startLearn(subject, first) {
  const S = SUBJECTS[subject], know = view(subject);
  const item = lastAsked[subject] = pick(know, lastAsked[subject], Math.random, S.order, S.start), k = know[item];
  const q = MAKERS[subject](item, k, k >= KNOWN ? 3 : 2, inPlay(know, S.order, S.start).filter(x => x !== item)); // few rivals while a thing is new
  paint(`var(--${ACTS[subject].color})`);
  const tiles = shuffle([q.right, ...q.wrong]).map(pic => Object.assign(el('button', { className: 'cap choice', tabIndex: -1 }, pic.node), { pic }));
  const target = tiles.find(tile => tile.pic === q.right), row = el('div', { className: tiles.length === 2 ? 'choices two' : 'choices' }, ...tiles);
  if (q.sound) scene.append(el('button', { className: 'cap ear', tabIndex: -1, innerHTML: SOUND })); else if (q.top) scene.append(q.top);
  scene.append(row);
  if (subject === 'english' && lacksVoice(!FR)) scene.append(el('p', { className: 'how', textContent: t('noVoice') }));
  mouseKit(false);
  let done = false, wrong = false, hinted = false, last = -Infinity, openAt = Infinity, hintTimer;
  const hint = () => { hinted = true; target.classList.add('glow'); };
  function ask(repeat) {
    if (done) return;
    openAt = performance.now() + 800; // no answer counts before the question has started
    caption(q.text);
    say(!repeat && q.intro ? [...q.intro, ...q.ask] : q.ask, () => q.sound && playSound(q.sound));
  }
  function choose(tile) {
    const now = performance.now();
    if (done || now < openAt || now - last < 700 || tile.classList.contains('no')) return;
    last = now;
    clearTimeout(hintTimer);
    if (tile !== target) {
      wrong = true;
      page.misses++;
      tile.classList.add('no');
      oops();
      wiggle(tile);
      hint();
      return later(() => say([tile.pic.oops], () => later(() => ask(true), 400)), AFTER_OOPS);
    }
    done = true;
    tile.classList.add('yes');
    row.classList.add('done'); // the right one stands out, the others fade
    me.know[subject][item] = grade(k, { wrong, hinted });
    save();
    cheer();
    caption(q.yes);
    let left = false;
    const next = () => { if (!left) { left = true; later(() => mount(subject), 1400); } };
    later(next, 15000); // should the voice never report back
    later(() => q.praise(next, tile), AFTER_CHEER);
  }
  on(play, 'pointerdown', e => {
    const tile = e.target.closest('.choice');
    if (e.target.closest('#leave')) return;
    if (e.target.closest('.ear')) return playSound(q.sound);
    if (tile) choose(tile); else if (e.pointerType === 'mouse') miss();

    if (typed) choose(typed); else if (side === null) tick(); else choose(tiles[side]);

const tileOf = info => info.img ? photo(info) : css(el('div', { className: 'disc' }), '--c', info.bg);
// n pictures of the same animal, scattered: no neat rows, so that it is the number that is learned and not a pattern
function setOf(info, n) {
  return el('div', { className: 'set' }, ...shuffle([...Array(9).keys()]).slice(0, n).map(cell => {
    const img = photo(info);
    img.style.left = `${3 + (cell % 3) * 32 + rand(0, 4)}%`;
    img.style.top = `${3 + Math.floor(cell / 3) * 32 + rand(0, 4)}%`;
    return img;
  }));
}
// say how many, count them one by one, say how many again
function countAloud(pics, label, done, fr = FR) {
  const step = i => {
    if (i === pics.length) return say([upper(label) + ' !'.slice(fr ? 0 : 1)], done);
    pics[i].classList.add('on');
    say([NUMS[+fr][i + 1]], () => later(() => step(i + 1), 350));
  };
  say([upper(label) + '.'], () => later(() => step(0), 300));
}
// A shape drawn in code. `odd` gives the versions books leave out: thin, tilted, upside down. They are just as much a triangle.
function shapeOf(kind, odd = false, color = one(BG)) {
  const tilt = odd ? one([0, 20, -25, 45, 90]) : 0, body = {
    circle: () => `<circle cx="50" cy="50" r="${odd ? rand(20, 38) : 36}"/>`,
    square: () => { const s = odd ? rand(34, 56) : 60; return `<rect x="${50 - s / 2}" y="${50 - s / 2}" width="${s}" height="${s}" rx="2"/>`; },
    triangle: () => `<polygon points="${odd ? one(['20,22 86,36 30,84', '50,86 12,22 88,22', '10,78 90,78 76,34', '42,10 62,90 34,90']) : '50,14 90,84 10,84'}"/>`,
    rectangle: () => { const [w, h] = odd ? one([[26, 80], [84, 22], [70, 34]]) : [80, 46]; return `<rect x="${50 - w / 2}" y="${50 - h / 2}" width="${w}" height="${h}" rx="2"/>`; },
  }[kind]();

    const sound = info.clip && k >= KNOWN && Math.random() < .5 ? info.clip : '', text = sound ? t('who') : info.img ? whereIs(info) : whichBall(info);

  },

    const rivals = [...new Set([...shuffle(live.filter(alike)), ...INTRO.filter(alike)])].slice(0, n - 1).map(keyInfo);
    const text = info.img ? whereIs(info, L2) : whichBall(info, L2), word = info.img ? the(info, L2) : nameOf(info, L2);

             praise: done => say([other(TX.yes[+L2]), other(info.img ? word : ballIs(info, L2))], () => { if (info.clip) playSound(info.clip); later(done, info.clip ? 3200 : 800); }) };

    if (item[0] === 'd' && !(k >= 1 && Math.random() < .5)) {

      const text = FR ? `Où est le ${NUMS[1][N]} ?` : `Where is number ${NUMS[0][N]}?`;
      return { text, ask: [text], yes: `${N}`, right: digit(N), wrong: others.map(digit), praise: done => say([t('yes'), FR ? `Le ${NUMS[1][N]}.` : `Number ${NUMS[0][N]}.`], done) };

  },
  // circle, square, triangle, rectangle (odd versions once the plain one is found); big and small; what comes next in a pattern

      const plain = kind => ({ node: shapeOf(kind, false, tint[kind]), oops: FR ? `Ça, c'est un ${shapeWord(kind)}.` : `That's a ${shapeWord(kind)}.` });
      const top = el('div', { className: 'top' }, ...line.map(kind => shapeOf(kind, false, tint[kind])), el('div', { className: 'cap', textContent: '?' }));
      return { text: t('next'), ask: [t('next')], yes: shapeWord(answer), top, right: plain(answer), wrong: [answer === a ? b : a, c].slice(0, n - 1).map(plain),
               praise: done => say([t('yes'), [...line, answer].map(kind => shapeWord(kind)).join(', ') + ' !'.slice(FR ? 0 : 1)], done) };
    }
    const rivals = [...new Set([...shuffle(live.filter(x => SHAPES[x])), ...shuffle(kinds)])].filter(x => x !== item).slice(0, n - 1);
    const text = FR ? `Où est le ${shapeWord(item)} ?` : `Where is the ${shapeWord(item)}?`;
    return { text, ask: [text], yes: shapeWord(item), right: pic(item), wrong: rivals.map(kind => pic(kind)), praise: done => say([t('yes'), SHAPES[item][2][+FR]], done) };
  },
};

// ---- keyboard activities ----

// The mirror: a little keyboard on screen with the same places as the real one. What the hand presses lights up here.
// With big keys, a zone is drawn as one key. (A two-year-old cannot yet read it as a map of the real keyboard; it is
// there for the grown-up to point at, and for later.)
let layout = null; // the letters printed on this very keyboard, where the browser can tell (Chrome, Edge)
navigator.keyboard?.getLayoutMap?.().then(map => { layout = map; $$('.key i').forEach(i => { i.textContent = legend(i.parentNode.dataset.code); }); }).catch(() => {});
const AZERTY = { KeyQ: 'a', KeyW: 'z', KeyA: 'q', KeyZ: 'w', KeyM: ',' };
const legend = code => code.startsWith('Digit') ? code.slice(5) : (layout?.get(code) || (FR && AZERTY[code]) || code.slice(3)).toUpperCase();
const shown = code => keyInfo(homeOf(code, me.grain)); // what a press on this key shows, given the size of the keys
const capsOf = item => $$(`.key[data-item="${item}"]`);
function mirror(grain = me.grain) {
  if (grain === 'big') return el('div', { className: 'mirror big' }, ...homes(grain).map(item => {
    const cap = el('button', { className: 'cap key', tabIndex: -1 }, photo(keyInfo(item)));
    Object.assign(cap.dataset, { item, code: item });
    return cap;
  }));
  return el('div', { className: 'mirror' }, ...ROWS.map(row => {
    const line = el('div');
    row.forEach((code, i) => {
      const item = homeOf(code, grain), info = keyInfo(item);
      if (i && homeOf(row[i - 1], grain) === item) return css(line.lastChild, '--n', ++line.lastChild.span);
      const cap = css(el('button', { className: 'cap key', tabIndex: -1, span: 1 }), '--c', info.img ? '#fff' : info.bg);
      Object.assign(cap.dataset, { item, code });
      if (info.img) cap.append(photo(info));
      if (grain === 'all') cap.append(el('i', { textContent: legend(code) }));
      line.append(cap);
    });
    return line;
  }));
}
function stageKit() {
  scene.append(el('div', { className: 'stage' }, el('div', { className: 'card idle' }, el('img', { alt: '' }), el('div', { className: 'blob' })),
                  el('div', { className: 'word small' }), el('p', { className: 'ask' })), mirror());
  on(scene, 'pointerdown', e => { const cap = e.target.closest('.key'); if (cap) onKey?.(cap.dataset.code, performance.now()); }); // a tap on the mirror is a press too (tablets)
  peekKit();
}
// with the keyboard, the pointer is hidden until a grown-up moves the mouse
function peekKit() {
  let hide;
  on(play, 'pointermove', e => { if (e.pointerType !== 'mouse') return; play.classList.add('peek'); clearTimeout(hide); hide = later(() => play.classList.remove('peek'), 2000); });
}
function put(info, text = info.name, bg = info.bg, fg = info.fg) {
  paint(bg, fg);
  $('.card').className = info.img ? 'card' : 'card colour';
  if (info.img) $('.card img').src = info.img; else $('.card .blob').style.background = info.bg;
  $('.word').className = 'word';
  $('.word').textContent = text;
}
function light(item) {
  $$('.key.on').forEach(cap => cap.classList.remove('on'));
  capsOf(item).forEach(cap => cap.classList.add('on'));
  later(() => capsOf(item).forEach(cap => cap.classList.remove('on')), STAGE_MS);
}

// Press: cause and effect. One press, one animal, its name heard to the end, then its call.
function startExplore(first) {
  stageKit();
  $('.word').textContent = t('pressAny');
  if (first) say([t('pressAny')]);
  let last = -Infinity, lastInfo = null, naming = false;
  onKey = (code, now) => {
    if (naming || !accept(now, last)) return;
    if (timeUp()) return goodbye();
    last = now;
    const info = code === 'Space' ? lastInfo : shown(code);
    if (!info) return tick();
    lastInfo = info;
    blip(ALL.indexOf(info.code));
    put(info);
    again($('.card'), 'pop');
    light(info.code);
    $('.ask').innerHTML = BUBBLE;
    $('.ask').append(askFor(info, me.seen[info.code] || 0));
    meet(info.code);
    // the next press waits until the word has been heard (4 s at most, should the voice never report back)
    naming = true;
    const heard = () => { naming = false; };
    later(heard, 4000);
    later(() => tell(info, '', heard), AFTER_BLIP);
  };
}

// Count: one press, one more, and its number said aloud. Until the child knows "three" (in Numbers), the game counts
// with them and stops at the right number. After that they must stop themselves and say so: the "give me three" task.
const countPlan = () => { const know = view('numbers'); return { give: know.q3 >= KNOWN, max: know.q3 >= KNOWN ? 5 : 3 }; };
let lastCount = 0;
function startCount(first) {
  const { give, max } = countPlan(), N = lastCount = one([...Array(max).keys()].map(i => i + 1).filter(n => n !== lastCount || max === 1)), animal = byName(one(COUNTABLE));
  paint('var(--leaf)');
  const pond = el('div', { className: 'pond' }), okay = el('button', { className: 'cap okay', tabIndex: -1, innerHTML: CHECK, hidden: true });
  scene.append(pond, okay);
  peekKit();
  caption(upper(some(animal, N)));
  let count = 0, last = -Infinity, busy = true, guided = !give, fails = 0;
  const order = () => FR ? `${guided ? 'On compte' : 'Donne'} ${some(animal, N)}.` : `${guided ? "Let's count" : 'Give me'} ${some(animal, N)}.`;
  const resume = () => { busy = false; okay.hidden = guided; };
  let begun = false;
  const begin = () => { if (!begun) { begun = true; resume(); } };
  say([order(), guided ? '' : t('done')], begin);
  later(begin, 6000); // should the voice never report back
  if (give && first) scene.append(el('p', { className: 'how', textContent: t('giveHow') }));
  const won = () => {
    busy = true;
    okay.hidden = true;
    cheer();
    later(() => say([t('yes'), upper(some(animal, N)) + ' !'.slice(FR ? 0 : 1)], () => later(() => mount('count'), 1600)), AFTER_CHEER);
    later(() => mount('count'), 9000);
  };
  function add(now) {
    if (busy || now - last < 650) return;
    last = now;
    pond.append(Object.assign(photo(animal), { className: 'pop' }));
    const said = ++count;
    blip(said);
    later(() => say([NUMS[+FR][said]], () => { if (guided && said === N) later(won, 300); }), AFTER_BLIP);
    if (guided && count === N) busy = true; // that was the last one: nothing more to add
    else if (count > N + 2) finish(); // far past it: stop and look together
  }
  function finish() {
    if (busy || guided || !count) return tick();
    if (count === N) return won();
    busy = true;
    oops();
    later(() => say([FR ? `Ça fait ${some(animal, count)}. On voulait ${some(animal, N)}.` : `That's ${some(animal, count)}. We wanted ${some(animal, N)}.`], () => {
      pond.replaceChildren();
      count = 0;
      guided = ++fails >= 2; // twice wrong: count it together this time
      resume();
      say([order()]);
    }), AFTER_OOPS);
  }
  onKey = (code, now) => code === 'Space' || code === 'Enter' ? finish() : add(now);
  on(play, 'pointerdown', e => { if (e.target.closest('#leave')) return; if (e.target.closest('.okay')) finish(); else add(performance.now()); });
}

// Race: the numbers 1 to 10 in a line. The die says one or two; each press is one hop, and each square's number is said
// as the animal lands on it. This is the board game from the studies, with a key for a counter.
function startRace() {
  paint('var(--grape)');
  const animal = byName(one(COUNTABLE)), dice = el('div', { className: 'cap dice' });
  const lane = el('div', { className: 'lane' }, ...Array.from({ length: 10 }, (_, i) => el('div', { className: 'cap', textContent: i + 1 })));
  const runner = Object.assign(photo(animal), { className: 'runner' });
  scene.append(dice, lane, runner);
  peekKit();
  let at = 0, left = 0, last = -Infinity, rolls = 0, armed = 0;
  const land = () => { // put the runner above its square (before the first hop: just short of square one)
    const box = (lane.children[at - 1] || lane.children[0]).getBoundingClientRect();
    runner.style.translate = `${box.left - (at ? 0 : box.width * .45)}px ${box.top - box.height * 1.25}px`;
    [...lane.children].forEach((cap, i) => cap.classList.toggle('here', i === at - 1));
  };
  const roll = () => {
    const steps = Math.min(one([1, 2]), 10 - at), mine = ++rolls, arm = () => { if (armed < mine) { armed = mine; left = steps; } };
    dice.textContent = steps;
    again(dice, 'pop');
    say([FR ? `Avance de ${NUMS[1][steps]}.` : `Move ${NUMS[0][steps]}.`], arm);
    later(arm, 3000); // should the voice never report back
  };
  const hop = now => {
    if (!left || now - last < 600) return;
    last = now;
    left--;
    at++;
    land();
    blip(at);
    const landed = at;
    later(() => say([NUMS[+FR][landed]], () => {
      if (landed < 10) return left || later(roll, 700);
      cheer();
      later(() => say([t('win')], () => later(() => mount('race'), 1800)), AFTER_CHEER);
    }), AFTER_BLIP);
    if (at === 10) { left = 0; later(() => mount('race'), 9000); }
  };
  onKey = (code, now) => hop(now);
  on(play, 'pointerdown', e => { if (!e.target.closest('#leave')) hop(performance.now()); });
  on(window, 'resize', land);
  land();
  later(roll, 600);
}

// Find: "where does the cow live?" Its key glows on the mirror, at once for a new friend, later and later for an old one.
function startFind() {
  stageKit();
  const places = homes(me.grain), order = INTRO.filter(code => places.includes(code));
  let last = -Infinity, q = null, hintTimer;
  const hint = () => { q.hinted = true; capsOf(q.code).forEach(cap => cap.classList.add('target')); };
  function ask() {
    if (timeUp()) return goodbye();
    const know = view('keys', order);
    q = { code: pick(know, q?.code, Math.random, order), wrong: false, hinted: false };
    const info = keyInfo(q.code), live = inPlay(know, order);
    $$('.key').forEach(cap => { cap.classList.remove('target', 'on'); cap.classList.toggle('out', !live.includes(cap.dataset.item)); });
    put(info, info.name + (FR ? ' ?' : '?'), NIGHT, '#fff');
    $('.card').classList.add('asking');
    say([whereIs(info)]);
    hintTimer = later(hint, hintDelay(know[q.code]));
  }
  onKey = (code, now) => {
    if (!accept(now, last)) return;
    last = now;
    const info = shown(code);
    if (!info) return tick();
    clearTimeout(hintTimer);
    if (info.code !== q.code) {
      // a wrong key still teaches: say what it was, then show where the right one is
      q.wrong = true;
      oops();
      wiggle($('.stage'));
      later(() => say([thatIs(info)]), AFTER_OOPS);
      return hint();
    }
    me.know.keys[q.code] = grade(me.know.keys[q.code] || 0, q);
    meet(q.code);
    cheer();
    put(info);
    again($('.card'), 'pop');
    $$('.key.target').forEach(cap => cap.classList.remove('target'));
    light(q.code);
    later(() => tell(info, t('yes')), AFTER_CHEER);
    last = now + 3000; // a longer stage for the celebration
    later(ask, STAGE_MS + 3000);
  };
  ask();
}

// ---- mouse activities ----

// how did that page go? smooth pages lift the level, a hard one brings it back down
function settle(kind) {
  const next = nextLevel({ lvl: me.lvl[kind], streak: me.streak[kind] }, { misses: page.misses, secs: (performance.now() - page.t0) / 1000 }, RULES[kind]);
  me.lvl[kind] = next.lvl;
  me.streak[kind] = next.streak;
  save();
}
const pageDone = (kind, wait) => later(() => { cheer(); settle(kind); later(() => mount(kind), 2600); }, wait);

// Step 1, move: the hand moves, the lamp moves. Animals sleep in the dark and wake when the lamp finds them. No click needed.
function startMove(first) {
  const { n, size, light, dwell } = spec('move');
  paint('var(--leaf)'); // the meadow, seen through the lamp
  const dark = css(el('div', { className: 'dark' }), '--r', `${light}vmin`);
  const places = shuffle([...Array(8).keys()]); // a 4 x 2 grid of hiding places
  const sleepers = shuffle(LETTERS).slice(0, n).map((code, i) => {
    const info = keyInfo(code), node = css(el('div', { className: 'sleeper' }, photo(info)), '--s', `${size}vmin`);
    node.style.left = `${14 + (places[i] % 4) * 21 + rand(-2, 2)}%`;
    node.style.top = `${32 + (places[i] >> 2) * 33 + rand(-4, 4)}%`;
    scene.append(node);
    return { info, node, since: 0, awake: false };
  });
  scene.append(dark);
  mouseKit();
  if (first) say([t('moveIt')]);
  let found = 0, lastFound = -Infinity, moved = false;
  const aim = () => { css(dark, '--x', `${ptr.x}px`); css(dark, '--y', `${ptr.y}px`); };
  aim();
  on(play, 'pointermove', () => { if (!moved) page.t0 = performance.now(); moved = true; aim(); });
  on(play, 'pointerdown', aim);
  const watch = setInterval(() => {
    const now = performance.now();
    if (!moved || found === n || !accept(now, lastFound)) return; // one animal at a time, like one key at a time
    for (const s of sleepers) {
      if (s.awake) continue;
      const box = s.node.getBoundingClientRect();
      const lit = Math.hypot(ptr.x - box.left - box.width / 2, ptr.y - box.top - box.height / 2) < box.width / 2 + vmin(light) * .3;
      s.since = lit ? s.since || now : 0;
      if (!lit || now - s.since < dwell) continue;
      s.awake = true;
      s.node.classList.add('awake');
      lastFound = now;
      meet(s.info.code);
      blip(found);
      caption(s.info.name);
      later(() => tell(s.info), AFTER_BLIP);
      if (++found === n) {
        settle('move');
        later(() => { dark.classList.add('dawn'); cheer(); caption(t('morning')); later(() => say([t('morning')]), AFTER_CHEER); later(() => mount('move'), 3800); }, STAGE_MS + 1500);
      }
      break;
    }
  }, 80);
  cleanup.push(() => clearInterval(watch));
}

// Step 2, click: big keys hide an animal each. Aim, click, and it comes out. The keys get smaller and more numerous.
// (This one is for the hand, not for words: things to lift and open distract a two-year-old from the word.)
function startClick(first) {
  const { n, size } = spec('click');
  paint('var(--sun)', NIGHT);
  const flaps = css(css(el('div', { className: 'flaps' }), '--s', `${size}vmin`), '--size', `${size * 1.25}vmin`);
  flaps.style.maxWidth = `${(n === 4 ? 2 : Math.min(n, 3)) * (size + 4.5)}vmin`;
  const tint = Math.floor(rand(0, BG.length));
  let opened = 0, last = -Infinity;
  shuffle(LETTERS).slice(0, n).forEach((code, i) => flaps.append(Object.assign(css(el('button', { className: 'cap flap', tabIndex: -1 }, photo(keyInfo(code))), '--c', BG[(tint + i) % BG.length]), { info: keyInfo(code) })));
  scene.append(flaps);
  mouseKit();
  if (first) say([t('clickIt')]);
  on(play, 'pointerdown', e => {
    const flap = e.target.closest('.flap'), now = performance.now();
    if (e.target.closest('#leave')) return;
    if (!flap) return miss();
    if (now - last < 600) return;
    last = now;
    if (!flap.classList.contains('open')) {
      flap.classList.add('open');
      meet(flap.info.code);
      if (++opened === n) pageDone('click', STAGE_MS + 2000);
    }
    blip(opened);
    caption(flap.info.name);
    later(() => tell(flap.info), AFTER_BLIP);
  });
}

// Step 3, drag: press on the ball, keep pressing, carry it to the basket of its colour, let go.
// A click without holding also works: the ball then sticks to the pointer until the next click. (Studies disagree on
// which of the two is easier for young children, so both are accepted.)
function startDrag(first) {
  const { n } = spec('drag');
  paint('#e9e6f7', NIGHT);
  const colours = shuffle(ROWS[0]).slice(0, n).map(keyInfo);
  const shelf = el('div', { className: 'shelf' }, ...colours.map(info => Object.assign(css(el('div', { className: 'cap basket' }), '--c', info.bg), { info })));
  const ball = el('div', { className: 'ball' });
  scene.append(shelf, ball);
  mouseKit();
  let want, at, rest, grab = null, sticky = false, busy = true, served = 0;
  const moveTo = (x, y, glide = false) => { at = { x, y }; ball.classList.toggle('glide', glide); ball.style.translate = `${x}px ${y}px`; };
  const basketAt = () => [...shelf.children].find(b => {
    const box = b.getBoundingClientRect(), m = box.width * .15;
    return at.x > box.left - m && at.x < box.right + m && at.y > box.top - m * 2 && at.y < box.bottom + m;
  });
  function serve() {
    want = one(colours);
    css(ball, '--c', want.bg).className = 'ball';
    rest = { x: innerWidth * rand(.2, .75), y: innerHeight * rand(.24, .4) };
    moveTo(rest.x, rest.y);
    again(ball, 'pop');
    busy = false;
    say([first && !served ? t('dragIt') : '', ballIs(want)]);
  }
  function drop() {
    grab = null;
    sticky = false;
    ball.classList.remove('held');
    const basket = basketAt();
    for (const b of shelf.children) b.classList.remove('open');
    if (!basket) return; // let go on the way: the ball waits where it is
    if (basket.info !== want) {
      // the wrong basket still teaches: say its colour, and the ball goes back
      page.misses++;
      oops();
      wiggle(basket);
      later(() => say([thatOne(basket.info, ['basket', 'panier'])]), AFTER_OOPS);
      return moveTo(rest.x, rest.y, true);
    }
    busy = true;
    const box = basket.getBoundingClientRect();
    moveTo(box.left + box.width / 2, box.top + box.height * .3, true);
    ball.classList.add('in');
    blip(4);
    caption(want.name);
    later(() => say([t('yes'), ballIs(want)]), AFTER_BLIP);
    if (++served === 3) pageDone('drag', 2400); else later(serve, 2600);
  }
  on(play, 'pointerdown', e => {
    if (busy || e.target.closest('#leave')) return;
    if (sticky) return drop();
    if (e.target !== ball) return miss();
    grab = { dx: at.x - e.clientX, dy: at.y - e.clientY, x: e.clientX, y: e.clientY, t: performance.now() };
    ball.classList.remove('glide');
    ball.classList.add('held');
  });
  on(play, 'pointermove', e => {
    if (!grab) return;
    moveTo(e.clientX + grab.dx, e.clientY + grab.dy);
    const over = basketAt();
    for (const b of shelf.children) b.classList.toggle('open', b === over);
  });
  on(window, 'pointerup', e => {
    if (!grab || sticky) return;
    if (performance.now() - grab.t < 300 && Math.hypot(e.clientX - grab.x, e.clientY - grab.y) < 12) sticky = true; else drop();
  });
  later(serve, 300);
}

// ---- input ----

addEventListener('keydown', e => {
  if (!act) return; // on the home page the keyboard belongs to the parent
  e.preventDefault(); // swallow tab, space-scroll, backspace, F-keys…
  if (e.repeat || e.metaKey || e.ctrlKey) return; // a held key is one press; leave shortcuts to the parent
  if (e.code === 'Escape') return holdStart();
  if (onKey) onKey(e.code, performance.now()); else tick();
});
addEventListener('keyup', e => { if (e.code === 'Escape') holdEnd(); });

addEventListener('beforeunload', e => {
  if (!act) return;
  e.preventDefault();
  e.returnValue = '';
});

renderHome();

// ---- self-check: open index.html#test ----

if (location.hash === '#test') {
  let failed = 0;
  const ok = (cond, msg) => { if (!cond) { failed++; console.error('FAIL', msg); } };
  const seen = new Set();
  ok(LETTERS.length === ANIMALS.length, 'one animal per letter key');
  ok(ROWS[0].length === COLORS.length, 'one colour per digit key');
  for (const code of ALL) {
    const k = keyInfo(code);
    ok(k && k.emoji && k.name && k.bg, `${code} has an emoji, a name and a colour`);
    ok(!seen.has(k.emoji), `${code} has its own emoji`);
    seen.add(k.emoji);
    ok(JSON.stringify(k) === JSON.stringify(keyInfo(code)), `${code} is stable`);
  }
  ok(ROWS[0].every(code => keyInfo(code).sound === '' && !keyInfo(code).img), 'colours have no animal sound or photo');
  ok(LETTERS.every(code => keyInfo(code).sound && keyInfo(code).img), 'animals have a spoken sound and a photo');
  ok([...CLIPS].every(a => ANIMALS.some(([, en]) => en === a)), 'every clip belongs to an animal');
  for (const code of ['Space', 'Enter', 'ArrowUp', 'Backquote', 'F5', '']) ok(keyInfo(code) === null && homeOf(code, 'big') === null, `${code} is not a toy key`);
  ok(accept(0, -Infinity) && accept(STAGE_MS, 0) && !accept(STAGE_MS - 1, 0), 'one press per stage');
  // big keys
  ok(homes('big').length === 6 && homes('mid').length === 12 && homes('all').length === ALL.length, 'six big keys, twelve medium ones, then every key');
  for (const grain of ['big', 'mid']) {
    ok(GRAINS[grain].every(en => ALL.some(code => keyInfo(code).en === en)), `${grain}: every name is an animal or a colour`);
    ok(ALL.every(code => zoneOf(code, grain).filter(c => GRAINS[grain].includes(keyInfo(c).en)).length === 1), `${grain}: one tenant per zone`);
    ok(ALL.every(code => zoneOf(code, grain).includes(homeOf(code, grain))), `${grain}: the tenant lives in its zone`);
  }
  ok($$('.key', mirror('big')).length === 6 && $$('.key', mirror('mid')).length === 12, 'six big keys and twelve wide ones on the mirror');
  ok(homes('big').every(code => homes('mid').includes(code)) && homes('big').every(code => keyInfo(code).img), 'nobody moves house when the keys shrink; big keys are animals');
  ok(homeOf('KeyW', 'big') === 'KeyQ' && homeOf('Digit1', 'big') === 'KeyQ' && homeOf('Digit1', 'mid') === 'Digit1' && homeOf('KeyW', 'all') === 'KeyW', 'the cow answers for its whole zone');
  ok($$('.key', mirror('all')).length === ALL.length && $$('.key i', mirror('all')).length === ALL.length, 'with every key, the mirror has them all, with their letter');
  ok(sideOf('KeyQ') === 0 && sideOf('KeyB') === 0 && sideOf('KeyP') === 1 && sideOf('Digit6') === 1 && sideOf('ArrowRight') === 1 && sideOf('Space') === null, 'left and right halves of the keyboard');
  ok(sideOf('KeyQ', 3) === 0 && sideOf('KeyT', 3) === 1 && sideOf('KeyP', 3) === 2 && sideOf('ArrowRight', 3) === 2 && sideOf('ArrowDown', 3) === 1 && sideOf('ArrowDown') === null, 'three pictures: left, middle, right');
  // the learner
  ok(INTRO.length === ALL.length && new Set(INTRO).size === ALL.length, 'every key is introduced exactly once');
  ok(INTRO.slice(0, 12).every(code => keyInfo(code).img), 'animals come before colours');
  ok(inPlay({}).length === START, 'three friends to start with');
  ok(inPlay({ [INTRO[0]]: KNOWN }).length === START + 1 && inPlay({ [INTRO[0]]: 1 }).length === START, 'a known one brings a new friend');
  ok(inPlay(Object.fromEntries(ALL.map(code => [code, 3]))).length === ALL.length, 'in the end everything is in play');
  ok(inPlay({}, homes('big')).length === START && inPlay(Object.fromEntries(ALL.map(code => [code, 3])), homes('big')).length === 6, 'with big keys, Find stays among the six');
  for (let i = 0; i < 50; i++) ok(pick({}, INTRO[0]) !== INTRO[0] && inPlay({}).includes(pick({}, INTRO[0])), 'never the same question twice, always something in play');
  ok(pick({ [INTRO[0]]: 3 }, INTRO[2], () => 0.5) === INTRO[1], 'what is not known yet comes back more often');
  ok(hintDelay(0) === 0 && [1, 2, 3].every(k => hintDelay(k) > hintDelay(k - 1)), 'help fades as a thing is learned');
  ok(grade(0, { wrong: false, hinted: true }) === 1 && grade(1, { wrong: false, hinted: true }) === 1, 'following the glow teaches a new thing, not an old one');
  ok(grade(1, { wrong: false, hinted: false }) === 2 && grade(3, { wrong: false, hinted: false }) === 3, 'found without help: one step up, three at most');
  ok(grade(2, { wrong: true, hinted: true }) === 1 && grade(0, { wrong: true, hinted: true }) === 0, 'a wrong answer first: one step down, never below zero');
  // subjects, from two to five
  for (const [subject, S] of Object.entries(SUBJECTS)) {
    ok(new Set(S.order).size === S.order.length && S.floor.length === 4 && S.floor.every((f, i) => f <= S.order.length && (!i || f >= S.floor[i - 1])), `${subject}: steps are unique, and an older child is assumed to know at least as much`);
    ok(Object.values(view(subject, S.order, 2, {})).every(k => k === 0) || S.floor[0] > 0, `${subject}: a two-year-old starts at the beginning`);
  }
  ok(view('numbers', SUBJECTS.numbers.order, 4, {}).q3 === KNOWN && view('numbers', SUBJECTS.numbers.order, 4, {}).q4 === 0 && view('numbers', SUBJECTS.numbers.order, 2, { q1: 3 }).q1 === 3, 'age gives a head start; what was learned here counts on top');
  ok(inPlay(view('numbers', SUBJECTS.numbers.order, 2, {}), SUBJECTS.numbers.order, 2).join() === 'q1,q2' && inPlay({ q1: 2, q2: 2 }, SUBJECTS.numbers.order, 2).includes('q3'), 'numbers start with one and two; three comes when they are known');
  for (const [subject, S] of Object.entries(SUBJECTS).filter(([name]) => MAKERS[name])) for (const item of S.order) for (const k of [0, 1, 2, 3]) for (const n of [2, 3]) {
    const q = MAKERS[subject](item, k, n, S.order.filter(x => x !== item).slice(0, 4));
    ok(q.text && q.ask.length && q.yes && typeof q.praise === 'function', `${subject}/${item}: a question, an answer and a way to say well done`);
    ok(q.right.node instanceof Node && q.wrong.length >= 1 && q.wrong.length <= n - 1 && q.wrong.every(w => w.node instanceof Node && w.oops), `${subject}/${item}: one right picture and one or two wrong ones, each with its name`);
  }
  ok(some(byName('duck'), 3, false) === 'three ducks' && some(byName('duck'), 1, false, true) === 'just one duck' && some(byName('cow'), 1, true) === 'une vache' && some(byName('duck'), 2, true) === 'deux canards' && some(byName('cow'), 1, true, true) === 'une seule vache', 'three ducks, une vache');
  ok(COUNTABLE.every(en => /^l[ea] /.test(byName(en).names[1])) && COUNTABLE.slice(0, 7).every(en => byName(en).names[1].startsWith('le ')), 'counting animals take a plain plural; the first seven are "le"');
  ok(sized(byName('duck'), true, true) === 'le grand canard' && sized(byName('cat'), false, false) === 'the small cat', 'big and small');
  ok(whereIs(byName('cow'), true) === 'Où est la vache ?' && whereIs(byName('cow'), false) === 'Where is the cow?' && whichBall(byName('red'), false) === 'Which ball is red?', 'any sentence in either language');
  // mouse levels
  const rule = RULES.click;
  ok(nextLevel({}, { misses: 0, secs: 5 }, rule).streak === 1 && nextLevel({ lvl: 1, streak: 1 }, { misses: 0, secs: 5 }, rule).lvl === 2, 'two smooth pages lift the level');
  ok(nextLevel({ lvl: 2, streak: 1 }, { misses: 4, secs: 5 }, rule).lvl === 2 && nextLevel({ lvl: 2, streak: 1 }, { misses: 4, secs: 5 }, rule).streak === 0, 'a so-so page keeps the level');
  ok(nextLevel({ lvl: 2, streak: 1 }, { misses: 9, secs: 5 }, rule).lvl === 1 && nextLevel({ lvl: 1 }, { misses: 9, secs: 5 }, rule).lvl === 1, 'a hard page takes a level back, never below one');
  ok(nextLevel({ lvl: 3, streak: 1 }, { misses: 0, secs: 5 }, rule).lvl === 3, 'three levels at most');
  ok(nextLevel({ lvl: 2 }, { misses: 0, secs: 200 }, RULES.move).lvl === 1 && nextLevel({ lvl: 2 }, { misses: 0, secs: 200 }, rule).lvl === 2, 'only Move is judged on time');
  ok(Object.keys(RULES).every(kind => ACTS[kind]?.track === 'ms' && RULES[kind].spec.length === 3), 'every mouse step has three levels');
  // sittings
  const mine = [me.minutes, sessionStart];
  me.minutes = 10; sessionStart = 0;
  ok(!timeUp(599999) && timeUp(600000), 'a ten-minute sitting ends after ten minutes');
  me.minutes = 0;
  ok(!timeUp(9e9), 'no limit means no end');
  [me.minutes, sessionStart] = mine;
  // words
  ok(Object.values(TX).every(pair => pair.length === 2 && pair.every(x => x.length)), 'every word exists in both languages');
  ok(Object.values(ACTS).every(a => [a.name, a.sub, a.age, a.help, a.why].every(pair => pair?.length === 2 && pair.every(Boolean)) && a.from >= 1.5 && (!a.tip || a.tip.every(Boolean))), 'every activity is named, dated and explained in both languages');
  ok(Object.values(ACTS).every(a => /\(.*\d{4}.*\)/.test(a.why[0]) && /\(.*\d{4}.*\)/.test(a.why[1])), 'every explanation names its sources');
  ok(the(keyInfo('KeyQ')) === (FR ? 'la vache' : 'the cow') && the(keyInfo('Digit5')) === (FR ? "l'orange" : 'orange'), 'articles');
  ok(ALL.every(code => [0, 1, 2, 3].every(turn => !askFor(keyInfo(code), turn).includes('{'))), 'every question for the grown-up is complete');
  ok(askFor(keyInfo('Digit5'), 0).includes(FR ? "d'orange" : 'orange'), 'elision');
  // every photo and clip must really exist next to this page
  const files = [...ANIMALS.map(([, en]) => `img/${en}.jpg`), ...[...CLIPS].map(a => `snd/${a}.mp3`)];
  Promise.all(files.map(f => fetch(f, { method: 'HEAD' }).then(r => ok(r.ok, `${f} exists`), () => ok(false, `${f} exists`)))).then(() => {
    document.title = failed ? `${failed} FAILED` : 'tests ok';
    $('.tag').textContent = failed ? `❌ ${failed} failed, see the console` : '✅ tests ok';
  });
}
</script>
